services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: career
      POSTGRES_PASSWORD: career
      POSTGRES_DB: ai_career_os
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career -d ai_career_os"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      args:
        # The local job-capture classifier needs torch, which roughly triples the
        # image (~400MB → ~1.1GB). It fails open when absent, so it is off by default.
        # Flip to "true" and rebuild to get the is-this-a-job-post pre-filter.
        INCLUDE_CLASSIFIER: "false"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override host-local DATABASE_URL from .env for in-compose networking
      DATABASE_URL: postgresql+asyncpg://career:career@db:5432/ai_career_os
      # Rewrite 127.0.0.1/localhost LLM URLs to reach LM Studio/Ollama on the host
      LLM_HOST_GATEWAY: host.docker.internal
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      # Reach LM Studio / Ollama on the host from inside the container
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app:/app/app
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\")"',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  pgdata:
