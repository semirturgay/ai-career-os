<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Career OS Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../shared/theme.css" />
    <style>
      body {
        max-width: 480px;
        margin: 40px auto;
        padding: 0 20px 40px;
      }
      label {
        display: block;
        margin-top: 20px;
        font-size: 13px;
        font-weight: 600;
        color: var(--color-text);
      }
      input {
        width: 100%;
        margin-top: 8px;
        padding: 10px 12px;
        border: 1px solid var(--color-border);
        border-radius: 10px;
        background: var(--color-surface-raised);
        font-family: inherit;
        font-size: 14px;
        color: var(--color-text);
      }
      input:focus {
        outline: none;
        border-color: var(--color-accent);
        box-shadow: 0 0 0 1px var(--color-accent);
      }
      .field-hint {
        margin-top: 6px;
        font-size: 12px;
        color: var(--color-text-muted);
      }
      #saved {
        margin-top: 12px;
        font-size: 13px;
        color: var(--color-success);
      }
    </style>
  </head>
  <body>
    <div class="brand-row">
      <svg class="logo-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#0f766e" />
        <path
          d="M8 22V12l4 3 4-5 4 4 4-6v14"
          stroke="white"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.95"
        />
        <circle cx="22" cy="9" r="2" fill="#99f6e4" />
      </svg>
      <div>
        <p class="brand-title">Career OS</p>
        <p class="brand-sub">Extension settings</p>
      </div>
    </div>

    <p class="card">Point the extension at your local AI Career OS backend. The UI is bundled in the side panel.</p>

    <label for="api-base-url">API base URL</label>
    <input id="api-base-url" type="url" />
    <p class="field-hint">FastAPI backend — usually http://127.0.0.1:8000</p>

    <button id="save-btn" type="button" class="btn btn-primary">Save</button>
    <div id="saved"></div>

    <script src="../shared/settings.js"></script>
    <script src="options.js"></script>
  </body>
</html>
