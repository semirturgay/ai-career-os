<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Career OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../shared/theme.css" />
    <style>
      body {
        padding: 14px;
        width: 300px;
      }
      .header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="brand-row">
        <svg class="logo-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#0f766e" />
          <path
            d="M8 22V12l4 3 4-5 4 4 4-6v14"
            stroke="white"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            opacity="0.95"
          />
          <circle cx="22" cy="9" r="2" fill="#99f6e4" />
        </svg>
        <div>
          <p class="brand-title">Career OS</p>
          <p class="brand-sub">Career matching</p>
        </div>
      </div>
      <div id="api-status" class="pill" title="API connection">
        <span class="pill-dot"></span>
        <span id="api-status-label">…</span>
      </div>
    </header>

    <p class="card" id="status">Click the toolbar icon to open the side panel. Capture jobs from there.</p>

    <button id="open-panel-btn" type="button" class="btn btn-primary">Open side panel</button>
    <button id="options-btn" type="button" class="btn btn-ghost">Settings</button>

    <p class="hint">Capture reads the active tab DOM only — never fetches job URLs.</p>

    <script src="../shared/settings.js"></script>
    <script src="../shared/panel.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
