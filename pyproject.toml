[project]
name = "ai-career-os"
version = "0.1.0"
description = "An AI Operating System for career management"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.17",
    "pypdf>=5.1.0",
    "httpx>=0.28.0",
    "fpdf2>=2.8.7",
    "ddgs>=9.14.4",
    "fastembed>=0.8.0",
    "pgvector>=0.5.0",
    "huggingface-hub>=1.25.1",
]

[project.optional-dependencies]
# The local document classifier (smr123/resume-job-classifier) needs torch, which is by
# far the largest thing this project can install — for a pre-capture filter that fails
# open when absent. Keeping it out of the base install is what makes the image small
# enough to deploy anywhere normal.
#
#   uv sync --extra classifier          # local dev, with the filter
#   docker build --build-arg INCLUDE_CLASSIFIER=true .
classifier = [
    "transformers>=5.14.1",
    "torch>=2.13.0",
]

# On Linux, PyPI's torch wheel bundles the whole CUDA toolchain: 2.9GB of nvidia
# libraries and 652MB of triton, which took the classifier image to 8.61GB. The model
# is a 512-token DistilBERT that classifies in ~8ms on CPU and never touches a GPU, so
# the CPU wheel is not a downgrade — it is the build we were always actually running.
# Scoped to Linux because macOS and Windows wheels are CPU-only on PyPI already.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live_llm: optional eval that calls a real configured LLM provider",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear (common footguns)
]
per-file-ignores = { "scripts/*" = ["E402"] }

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query"]
