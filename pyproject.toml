[project]
name = "ai-career-os"
version = "0.1.0"
description = "An AI Operating System for career management"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.17",
    "pypdf>=5.1.0",
    "httpx>=0.28.0",
    "fpdf2>=2.8.7",
    "duckduckgo-search>=8.1.1",
    "fastembed>=0.8.0",
    "pgvector>=0.5.0",
    "transformers>=5.14.1",
    "huggingface-hub>=1.25.1",
    "torch>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live_llm: optional eval that calls a real configured LLM provider",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear (common footguns)
]
per-file-ignores = { "scripts/*" = ["E402"] }

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query"]
